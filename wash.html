<script>
// ===== Firebase 即時戰報橋接 =====
function starroAnnounce(type,result,detail=""){
  if(typeof window.starroBroadcast==="function"){
    window.starroBroadcast(type,result,detail);
  }
}

const defaults=[{name:"精煉 1%",rate:1},{name:"精煉 2%",rate:2},{name:"華金洗詞第一階段",rate:50},{name:"華金洗詞第二階段",rate:10},{name:"附魔 5 等",rate:15}];
let steps=[{name:"精煉 1%",rate:1}];
function custom(){try{return JSON.parse(localStorage.getItem("starChanceCustom")||"[]")}catch(e){return[]}}
function allItems(){return defaults.concat(custom())}
function refreshSelect(){singleItem.innerHTML="";allItems().forEach((x,i)=>singleItem.add(new Option(`${x.name}（${x.rate}%）`,i)));syncSingle()}
function syncSingle(){let x=allItems()[+singleItem.value]||defaults[0];singleRate.value=x.rate}
function setTrials(n){singleTrials.value=n}
function pct(x){return x.toLocaleString(undefined,{maximumFractionDigits:6})+"%"}
function card(l,v,c=""){return `<div class="stat"><span class="label">${l}</span><b class="${c}">${v}</b></div>`}
function runSingle(){let p=Math.max(0,Math.min(100,+singleRate.value))/100,n=Math.max(1,Math.min(1000000,+singleTrials.value||1)),s=0,first=0,st=0,max=0;for(let i=1;i<=n;i++){if(Math.random()<p){s++;if(!first)first=i;st=0}else{st++;max=Math.max(max,st)}}singleResult.innerHTML=card("成功",s.toLocaleString(),"ok")+card("失敗",(n-s).toLocaleString(),"bad")+card("實際成功率",pct(s/n*100))+card("理論成功率",pct(p*100))+card("第一次成功",first?`第 ${first.toLocaleString()} 次`:"未成功")+card("最長連敗",max+" 次")+card("理論平均",p?(1/p).toLocaleString("zh-TW",{minimumFractionDigits:2,maximumFractionDigits:2})+" 次":"∞")}
function esc(s){return String(s).replaceAll("&","&amp;").replaceAll('"',"&quot;").replaceAll("<","&lt;").replaceAll(">","&gt;")}
function renderSteps(){stepsDiv=document.getElementById("steps");if(!stepsDiv)return;stepsDiv.innerHTML="";steps.forEach((x,i)=>{let d=document.createElement("div");d.className="row flow";d.innerHTML=`<input value="${esc(x.name)}" oninput="steps[${i}].name=this.value"><input type="number" min="0" max="100" step="0.0001" value="${x.rate}" oninput="steps[${i}].rate=+this.value;updateTheory()"><button class="danger" onclick="removeStep(${i})">刪除</button>`;stepsDiv.appendChild(d)});updateTheory()}
function addPreset(n,r){steps.push({name:n,rate:r});renderSteps()} function removeStep(i){steps.splice(i,1);renderSteps()} function clearSteps(){steps=[];renderSteps();let e=document.getElementById("flowResult");if(e)e.innerHTML=""}
function theoryRate(){return steps.reduce((a,x)=>a*Math.max(0,Math.min(100,+x.rate))/100,1)}
function updateTheory(){let p=theoryRate();let theoryEl=document.getElementById("theory");if(!theoryEl)return;theoryEl.innerHTML=steps.length?`<span class="badge">理論全過 ${pct(p*100)}</span> <span class="tiny">平均約 ${p?(1/p).toLocaleString("zh-TW",{minimumFractionDigits:2,maximumFractionDigits:2}):"∞"} 次流程 / 1件</span>`:"<span class='tiny'>請新增階段</span>"}
function runFlow(){if(!steps.length)return alert("請先新增階段");let flowTrialsEl=document.getElementById("flowTrials"),flowResultEl=document.getElementById("flowResult");if(!flowTrialsEl||!flowResultEl)return;let n=Math.max(1,Math.min(1000000,+flowTrialsEl.value||1)),s=0,first=0,st=0,max=0;for(let i=1;i<=n;i++){let ok=true;for(const x of steps){if(Math.random()>=Math.max(0,Math.min(100,+x.rate))/100){ok=false;break}}if(ok){s++;if(!first)first=i;st=0}else{st++;max=Math.max(max,st)}}let p=theoryRate();flowResultEl.innerHTML=card("全過成品",s.toLocaleString(),"ok")+card("失敗流程",(n-s).toLocaleString(),"bad")+card("實際全過率",pct(s/n*100))+card("理論全過率",pct(p*100))+card("第一次全過",first?`第 ${first.toLocaleString()} 次`:"未出現")+card("最長連敗",max+" 次")}
function saveCustom(){let n=newName.value.trim(),r=+newRate.value;if(!n||isNaN(r)||r<0||r>100)return alert("請輸入名稱與 0～100% 機率");let a=custom();a.push({name:n,rate:r});localStorage.setItem("starChanceCustom",JSON.stringify(a));newName.value="";newRate.value="";refreshSelect();alert("已儲存")}
function resetCustom(){if(confirm("確定清除自訂項目？")){localStorage.removeItem("starChanceCustom");refreshSelect()}}

let randomCounts={};
let randomDraws=0;
function drawRandomValue(){
 let mn=Math.floor(+randomMin.value), mx=Math.floor(+randomMax.value);
 if(!Number.isFinite(mn)||!Number.isFinite(mx)||mn>mx)return alert("請確認最小值與最大值");
 let value;
 if(mn===1 && mx===15){
   value=weightedFinalDamage();
 }else{
   value=Math.floor(Math.random()*(mx-mn+1))+mn;
 }
 randomDraws++;
 randomCounts[value]=(randomCounts[value]||0)+1;
 randomNow.innerHTML=`<div class="stat"><span class="label">本次抽到</span><b class="ok" style="font-size:32px">全技能終傷 +${value}%</b><span class="tiny">四區間推定模式｜+1～5：95%｜+6～10：4.5%｜+11～14：0.45%｜+15：0.05%</span></div>`;
 renderRandomStats(mn,mx);
}
function renderRandomStats(mn,mx){
 let entries=[];
 for(let i=mn;i<=mx;i++) if(randomCounts[i]) entries.push([i,randomCounts[i]]);
 entries.sort((a,b)=>b[1]-a[1]||a[0]-b[0]);
 let most=entries.length?`+${entries[0][0]}%（${entries[0][1]}次）`:"—";
 randomStats.innerHTML=card("已抽次數",randomDraws.toLocaleString())+
 card("目前最常出現",most)+
 card("可抽範圍",`+${mn}% ～ +${mx}%`);
 if(entries.length){
   randomStats.innerHTML += `<div class="stat" style="grid-column:1/-1"><span class="label">抽取分布</span><div style="margin-top:8px;line-height:1.9">${entries.sort((a,b)=>a[0]-b[0]).map(x=>`+${x[0]}%：${x[1]} 次（${(x[1]/randomDraws*100).toFixed(2)}%）`).join("　")}</div></div>`;
 }
}
function resetRandomStats(){randomCounts={};randomDraws=0;randomNow.innerHTML="";randomStats.innerHTML=""}


function huajinLine1(){
 return `${pick(["STR","AGI","VIT","INT","DEX","LUK"])} +${randint(1,10)}`;
}
function huajinLine2(){
 let k=pick(["P.ATK","S.MATK","C.RATE"]);
 return `${k} +${randint(1,10)}`;
}

let hj={tries:0,pass50:0,pass10:0,values:{},top3:[]};
function weightedFinalDamage(){
 const groups=[
   {min:1,max:5,w:95},
   {min:6,max:10,w:4.5},
   {min:11,max:14,w:0.45},
   {min:15,max:15,w:0.05}
 ];
 let total=groups.reduce((s,g)=>s+g.w,0);
 let r=Math.random()*total,chosen=groups[0];
 for(const g of groups){r-=g.w;if(r<0){chosen=g;break}}
 return Math.floor(Math.random()*(chosen.max-chosen.min+1))+chosen.min;
}
function huajinTrial(show=true){
 hj.tries++;
 if(Math.random()>=0.50){
   if(show) huajinNow.innerHTML=`<div class="stat"><span class="label">本次結果</span><b class="bad">❌ 50% 失敗</b></div>`;
   return;
 }
 hj.pass50++;
 if(Math.random()>=0.10){
   if(show) huajinNow.innerHTML=`<div class="stat"><span class="label">本次結果</span><b class="bad">✅ 50% → ❌ 10% 失敗</b></div>`;
   return;
 }
 hj.pass10++;
 const v=weightedFinalDamage();
 if(v===15) starroSaiGaoBroadcast("華金鎧甲／戰靴","全技能終傷 +15%",hj.tries,huajinCost.value);
 hj.values[v]=(hj.values[v]||0)+1;
 const l1=huajinLine1(),l2=huajinLine2();
 hj.top3.push({value:v,lines:[l1,l2,`全技能終傷 +${v}%`]});
 if(show){
   huajinNow.innerHTML=`<div class="stat"><span class="label">本次完整 3 詞</span><div style="font-size:20px;line-height:1.8"><b>${l1}</b><br><b>${l2}</b><br><b class="ok">全技能終傷 +${v}%</b></div><span class="tiny">只有成功出現第 3 詞時才顯示完整三條</span></div>`;
 }
}
function runHuajinOnce(){huajinTrial(true);renderHuajin()}
function runHuajinBatch(n){
 let lastSuccess=null;
 for(let i=0;i<n;i++){let before=hj.pass10;huajinTrial(false);if(hj.pass10>before){let keys=Object.keys(hj.values);lastSuccess=keys.length?keys[keys.length-1]:null}}
 huajinNow.innerHTML=`<div class="stat"><span class="label">批次完成</span><b>已連洗 ${n} 次</b></div>`;
 renderHuajin();
}
function renderHuajin(){
 let t=hj.tries||1;
 huajinStats.innerHTML=
 card("總洗詞次數",hj.tries.toLocaleString())+
 card("累計花費",(hj.tries*Math.max(0,+huajinCost.value||0)).toLocaleString()+" 紅利")+
 card("通過 50%",hj.pass50.toLocaleString(),"ok")+

const REFINE_BOX_COST=750;
const refineBoxItems=[
  {name:"神工匠的鐵鎚",tag:"小灰",p:16.67,cls:"",value:1},
  {name:"極限神工匠的鐵鎚",tag:"大灰",p:16.67,cls:"",value:110},
  {name:"乙太神工匠的鐵鎚",tag:"-1灰槌",p:16.67,cls:"",value:9},
  {name:"高密度乙太神工匠的鐵鎚",tag:"小金",p:13.33,cls:"",value:90},
  {name:"極限乙太神工匠的鐵鎚",tag:"-1金槌",p:13.33,cls:"",value:80},
  {name:"高密度極限乙太神工匠的鐵鎚",tag:"大金",p:10.00,cls:"refine-gold",value:800},
  {name:"傳說乙太神工匠的鐵鎚",tag:"傳說-1綠",p:10.00,cls:"refine-green",value:1000},
  {name:"高密度傳說乙太神工匠的鐵鎚",tag:"傳說大金",p:3.33,cls:"refine-legendary-gold",value:20000}
];

let refineBoxState={
  total:0,
  totalValue:0,
  counts:Object.fromEntries(refineBoxItems.map(x=>[x.name,0]))
};

function refineBoxPick(){
  const total=refineBoxItems.reduce((s,x)=>s+x.p,0);
  let r=Math.random()*total;
  for(const x of refineBoxItems){
    r-=x.p;
    if(r<0)return x;
  }
  return refineBoxItems[refineBoxItems.length-1];
}

function refineBoxOpen(n){
  const batch=Object.fromEntries(refineBoxItems.map(x=>[x.name,0]));
  for(let i=0;i<n;i++){
    const item=refineBoxPick();
    refineBoxState.total++;
    refineBoxState.totalValue+=item.value;
    refineBoxState.counts[item.name]++;
    batch[item.name]++;
  }

  const batchValue=refineBoxItems.reduce((sum,x)=>sum+batch[x.name]*x.value,0);
  const rows=refineBoxItems
    .filter(x=>batch[x.name]>0)
    .map(x=>x.cls?`<span class="${x.cls}">(${x.tag}) ${x.name}</span> × ${batch[x.name].toLocaleString()}｜${x.value.toLocaleString()} P/個`:`(${x.tag}) ${x.name} × ${batch[x.name].toLocaleString()}｜${x.value.toLocaleString()} P/個`)
    .join("<br>");

  document.getElementById("refineBoxNow").innerHTML=
    `<div class="stat"><span class="label">本次開啟 ${n.toLocaleString()} 箱</span>`+
    `<div class="tiny" style="line-height:1.9;margin-top:6px">花費 ${(n*REFINE_BOX_COST).toLocaleString()} P｜取得價值 ${batchValue.toLocaleString()} P｜淨值 ${(batchValue-n*REFINE_BOX_COST>=0?"+":"")+(batchValue-n*REFINE_BOX_COST).toLocaleString()} P<br>${rows}</div></div>`;

  refineBoxRender();
}

function refineBoxRender(){
  const s=refineBoxState;
  document.getElementById("refineBoxStats").innerHTML=
    card("每抽費用",REFINE_BOX_COST.toLocaleString()+" P")+
    card("累計開箱",s.total.toLocaleString())+
    card("累計花費",(s.total*REFINE_BOX_COST).toLocaleString()+" P")+
    card("取得總價值",s.totalValue.toLocaleString()+" P")+
    card("累計淨值",((s.totalValue-s.total*REFINE_BOX_COST)>=0?"+":"")+(s.totalValue-s.total*REFINE_BOX_COST).toLocaleString()+" P",(s.totalValue-s.total*REFINE_BOX_COST)>=0?"ok":"bad");

  document.getElementById("refineBoxDist").innerHTML=
    `<div class="stat"><span class="label">累計獲得</span>`+
    `<div class="tiny" style="line-height:1.9;margin-top:6px">`+
    refineBoxItems.map(x=>{
      const count=s.counts[x.name]||0;
      const rate=s.total?(count/s.total*100).toFixed(2):"0.00";
      return x.cls?`<span class="${x.cls}">(${x.tag}) ${x.name}</span>：${count.toLocaleString()} 次（${rate}%）｜${x.value.toLocaleString()} P/個`:`(${x.tag}) ${x.name}：${count.toLocaleString()} 次（${rate}%）｜${x.value.toLocaleString()} P/個`;
    }).join("<br>")+
    `</div></div>`;
}

function refineBoxReset(){
  refineBoxState={
    total:0,
    totalValue:0,
    counts:Object.fromEntries(refineBoxItems.map(x=>[x.name,0]))
  };
  document.getElementById("refineBoxNow").innerHTML="";
  document.getElementById("refineBoxStats").innerHTML="";
  document.getElementById("refineBoxDist").innerHTML="";
}


let xrG={
 draws:0,xr:0,ur:0,
 pity:0,
 guarantee:0,guaranteeXR:0,guaranteeUR1:0,guaranteeUR2:0,
 hitLog:[]
};
function xrOne(){
 xrG.draws++;
 xrG.pity++;
 let r=Math.random()*100, prize="一般";
 if(r<0.07){xrG.xr++;prize="XR大獎"}
 else if(r<0.105){xrG.ur++;prize="UR一獎"}
 else if(r<0.14){xrG.ur++;prize="UR二獎"}

 if(prize!=="一般"){
   xrG.hitLog.push({draw:xrG.pity,prize:prize,type:"自然"});
   // 只要自然抽到 XR大獎 / UR一獎 / UR二獎，保底立即重置。
   xrG.pity=0;
   return prize;
 }

 // 連續1001抽都沒有任何大獎時，才觸發3抽1保底；保底後重新從第1抽計算。
 if(xrG.pity>=1001){
   let g=pick(["XR大獎","UR一獎","UR二獎"]);
   xrG.guarantee++;
   if(g==="XR大獎") xrG.guaranteeXR++;
   else if(g==="UR一獎") xrG.guaranteeUR1++;
   else xrG.guaranteeUR2++;
   xrG.hitLog.push({draw:1001,prize:g,type:"保底"});
   xrG.pity=0;
 }
 return prize;
}
function xrDraw(n){
 let before=xrG.hitLog.length;
 for(let i=0;i<n;i++) xrOne();
 let fresh=xrG.hitLog.slice(before);
 fresh.filter(x=>x.prize==="XR大獎" && x.type!=="保底" && x.draw<=500)
      .forEach(x=>starroAnnounce("XR轉蛋","XR大獎",`1000抽內中獎｜第 ${x.draw} 抽`));
 let rows=fresh.length
   ? fresh.map(x=>`${x.type==="保底"?"🎁":"🎉"} 第 ${x.draw} 抽｜${x.prize}${x.type==="保底"?"（1001抽保底）":""}`).join("<br>")
   : "本次未出 XR / UR";
 xrNow.innerHTML=`<div class="stat"><span class="label">本次 ${n.toLocaleString()} 抽｜目前保底進度 ${xrG.pity}/1001</span><div style="margin-top:8px;line-height:1.9"><b>${rows}</b></div></div>`;
 renderXR();
}
function renderXR(){
 let t=xrG.draws||1;

let advWeaponState={draws:0,fourth:0,top:[]};
const ADV_WEAPON_COST=19;

function advWeaponRand(min,max){
  return Math.floor(Math.random()*(max-min+1))+min;
}
function advWeaponPick(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}
function advWeaponFirst(){
  const pool=[
    ()=>`SCR +${advWeaponRand(5,15)}`,
    ()=>`ATK +${advWeaponRand(50,250)}`,
    ()=>`MATK +${advWeaponRand(50,250)}`,

    ()=>`ASPD +${advWeaponRand(1,3)}`,
    ()=>`MHP +${advWeaponRand(1,20)}%`,
    ()=>`MSP +${advWeaponRand(1,20)}%`,
    ()=>`對所有種族攻擊的抗性 +${advWeaponRand(1,5)}%`,
    ()=>`對所有階級攻擊的抗性 +${advWeaponRand(1,5)}%`,
    ()=>`對所有體型攻擊的抗性 +${advWeaponRand(1,5)}%`
  ];
  return advWeaponPick(pool)();
}
function advWeaponSecond(){
  const pool=[
    ()=>`P.ATK +${advWeaponRand(1,15)}`,
    ()=>`S.MATK +${advWeaponRand(1,15)}`,
    ()=>`C.RATE +${advWeaponRand(1,10)}`,

    ()=>`H.PLUS +${advWeaponRand(1,15)}`
  ];

}
function advWeaponThird(){
  const pool=[
    "對首領類魔物的物理攻擊增加",
    "對首領類魔物的魔法攻擊增加",
    "對生命體型魔物的物理攻擊增加",
    "對生命體型魔物的魔法攻擊增加",
    "對全體型魔物的物理攻擊增加",
    "對全體型魔物的魔法攻擊增加",
    "對全種族魔物的物理攻擊增加",
    "對全種族魔物的魔法攻擊增加",

function starroDisplayText(v){
  return String(v ?? "").replaceAll("賽高🎉","最頂").replaceAll("賽高","最頂");
}

function starroMaxTag(isMax){
  return isMax ? "｜最頂" : "";
}

function starroSaiGaoBroadcast(type,result,tries,costPerTry){
  if(typeof window.starroBroadcast!=="function") return;
  const totalCost=Math.max(0,Number(tries)||0)*Math.max(0,Number(costPerTry)||0);
  window.starroBroadcast(
    type,
    `最頂｜${result}`,
    `洗到 ${result}｜累計花費 ${totalCost.toLocaleString()} 紅利`
  );
}

function starroTierNameByIndex(tier){
  return tier===3 ? "頂級" : tier===2 ? "稀有" : tier===1 ? "高級" : "一般";
}
function starroTierDisplayByIndex(tier){
  const name=starroTierNameByIndex(tier);
  return tier===3 ? `<span class="tier-top-red">${name}</span>` : name;
}
function starroTierDisplayLabel(label){
  const s=String(label ?? "");
  return s.includes("0.36%") ? `<span class="tier-top-red">${s}</span>` : s;
}

function advFinalDamageTierRoll(maxTop){
  // 官方四階機率：89.77% / 8.98% / 0.9% / 0.36%
  const weights=[89.77,8.98,0.9,0.36];
  const total=weights.reduce((a,b)=>a+b,0);
  let r=Math.random()*total;
  let tier=0;
  for(let i=0;i<weights.length;i++){
    r-=weights[i];
    if(r<0){tier=i;break;}
  }

  // 第4詞：1~10 / 11~15 / 16~24 / 25~30
  // 第5詞：1~10 / 11~15 / 16~19 / 20~25
  const ranges=maxTop===30
    ? [[1,10],[11,15],[16,24],[25,30]]
    : [[1,10],[11,15],[16,19],[20,25]];

  const [min,max]=ranges[tier];
  return {tier,value:advWeaponRand(min,max)};
}

function advWeaponOne(){
  advWeaponState.draws++;

  const roll=Math.random();
  let wordCount=1;
  if(roll<0.10) wordCount=4;
  else if(roll<0.25) wordCount=3;
  else if(roll<0.50) wordCount=2;

  const lines=[advWeaponFirst()];
  if(wordCount>=2) lines.push(advWeaponSecond());
  if(wordCount>=3) lines.push(advWeaponThird());

  let fourth=null;
  if(wordCount===4){
    const rolled=advFinalDamageTierRoll(30);
    fourth=rolled.value;
    lines.push(`全技能最終傷害 +${fourth}%（乘算）`);
    advWeaponState.fourth++;

    advWeaponState.top.push({
      draw:advWeaponState.draws,
      value:fourth,
      tier:rolled.tier,
      isMax: fourth === 30,
      lines:[...lines]
    });

    if(fourth === 30){
      starroSaiGaoBroadcast("進階武器鑑定",`第4詞 全技能最終傷害 +${fourth}%`,advWeaponState.draws,ADV_WEAPON_COST);
    }

    advWeaponState.top.sort((a,b)=>b.value-a.value || a.draw-b.draw);
    advWeaponState.top=advWeaponState.top.slice(0,10);
  }

  return fourth;
}
function advWeaponBatch(n){
  let hit=0,best=0,bestTier=0;
  for(let i=0;i<n;i++){
    const beforeDraw=advWeaponState.draws;
    const v=advWeaponOne();
    if(v!==null){
      hit++;
      const rec=advWeaponState.top.find(x=>x.draw===beforeDraw+1);
      const tier=rec?rec.tier:0;
      if(v>best){best=v;bestTier=tier;}
    }
  }
  const bestIsMax=hit && best===30;
  document.getElementById("advWeaponNow").innerHTML=
    `<div class="stat"><span class="label">本次 ${n.toLocaleString()} 次</span>`+
    `<div class="tiny" style="line-height:1.8;margin-top:5px">`+
    `第4詞出現 ${hit} 次${hit?`｜本批最高 <b class="ok">+${best}%｜${starroTierDisplayByIndex(bestTier)}${starroMaxTag(bestIsMax)}</b>`:"｜未出第4詞"}<br>`+
    `本次花費 ${(n*ADV_WEAPON_COST).toLocaleString()} 紅利</div></div>`;
  renderAdvWeapon();
}
function renderAdvWeapon(){
  const s=advWeaponState;
  const rate=s.draws?s.fourth/s.draws*100:0;
  document.getElementById("advWeaponStats").innerHTML=
    card("累計鑑定",s.draws.toLocaleString())+
    card("累計花費",(s.draws*ADV_WEAPON_COST).toLocaleString()+" 紅利")+
    card("第4詞出現",s.fourth.toLocaleString(),"ok")+
    card("第4詞實際率",rate.toFixed(2)+"%");
  document.getElementById("advWeaponTop").innerHTML=
    `<div class="label">🏆 第4詞 TOP 10</div>`+
    (s.top.length?s.top.map((x,i)=>
      `<div class="stat" style="margin-top:7px"><span class="label">#${i+1}｜第 ${x.draw.toLocaleString()} 次｜`+
      `<b class="ok">全技能最終傷害 +${x.value}%｜${starroTierDisplayByIndex(x.tier)}${starroMaxTag(x.isMax)}</b></span>`+
      `<div class="tiny" style="line-height:1.75;margin-top:5px">${x.lines.join("<br>")}</div></div>`
    ).join(""):`<div class="stat"><span class="tiny">尚未出現第4詞。</span></div>`);
}
function resetAdvWeapon(){
  advWeaponState={draws:0,fourth:0,top:[]};
  advWeaponNow.innerHTML="";advWeaponStats.innerHTML="";advWeaponTop.innerHTML="";
}

let weaponChipState={draws:0,top:[]};
const WEAPON_CHIP_COST=49;
function weaponChipOne(){
  weaponChipState.draws++;
  const rolled=advFinalDamageTierRoll(25);
  const value=rolled.value;
  const isMax=value===25;
  weaponChipState.top.push({draw:weaponChipState.draws,value,tier:rolled.tier,isMax});
  if(isMax){
    starroSaiGaoBroadcast("武器指定晶片",`第5詞 全技能最終傷害 +${value}%`,weaponChipState.draws,WEAPON_CHIP_COST);
  }
  weaponChipState.top.sort((a,b)=>b.value-a.value || a.draw-b.draw);
  weaponChipState.top=weaponChipState.top.slice(0,10);
  return {value,tier:rolled.tier,isMax};
}
function weaponChipBatch(n){
  let best=0,bestTier=0,bestIsMax=false,last=0,lastTier=0,lastIsMax=false;
  for(let i=0;i<n;i++){
    const rolled=weaponChipOne();
    last=rolled.value;
    lastTier=rolled.tier;
    lastIsMax=rolled.isMax;
    if(last>best){
      best=last;
      bestTier=lastTier;
      bestIsMax=lastIsMax;
    }
  }
  document.getElementById("weaponChipNow").innerHTML=
    `<div class="stat"><span class="label">本次 ${n.toLocaleString()} 次</span>`+
    `<div class="tiny" style="line-height:1.8;margin-top:5px">`+
    `本批最高 <b class="ok">全技能最終傷害 +${best}%｜${starroTierDisplayByIndex(bestTier)}${starroMaxTag(bestIsMax)}</b>｜最後一次 +${last}%｜${starroTierDisplayByIndex(lastTier)}${starroMaxTag(lastIsMax)}<br>`+
    `本次花費 ${(n*WEAPON_CHIP_COST).toLocaleString()} 紅利</div></div>`;
  renderWeaponChip();
}
function renderWeaponChip(){

let sssState={attempts:0,successes:0,cost:0};

 if(ok)sssState.successes++;
 return ok;
}

function sssRender(message=""){

 </div>`;

<script>
(() => {

    const box = el(id);

    const actual = s.attempts ? (s.success / s.attempts * 100).toFixed(3) : "0.000";
    const badText = ("bad" in s) ? `｜${badWord} <b>${s.bad.toLocaleString()} 個</b>` : "";

  }

  window.shieldClearBatch = function(n) {
    let hits = 0, bads = 0, hitDraws = [];
    for (let i = 0; i < n; i++) {
      clear.attempts++;

      const batchDraw = i + 1;

      if (Math.random() < 0.00033) {
        clear.success++;
        hits++;
        hitDraws.push(batchDraw);
        if (batchDraw <= 100 && typeof window.starroBroadcast === "function") {
          window.starroBroadcast("盾牌石","清澈石成功",`100次內中獎｜第 ${batchDraw} 抽`);
        }
      }
      if (Math.random() < 0.10) {
        clear.bad++;
        bads++;
      }
    }

    const hitText = hitDraws.length ? `｜出貨：${hitDraws.map(x=>`第 ${x} 抽`).join("、")}` : "";
    el("shieldClearNow").innerHTML =
      `<div class="stat"><b>本次 ${n.toLocaleString()} 次｜成功 ${hits.toLocaleString()} 次｜腐朽 ${bads.toLocaleString()} 個</b>` +
      `<div class="tiny">${hitText || "本次未出貨"}<br>本次花費 ${(n * 500).toLocaleString()} P</div></div>`;
    stats("shieldClearStats", clear, "累計腐朽");
  };


  window.shieldClearUntilHit = function() {
    let tries = 0, bads = 0;
    while (true) {
      tries++;
      clear.attempts++;
      clear.cost += 500;

      if (Math.random() < 0.10) {
        clear.bad++;
        bads++;
      }

      if (Math.random() < 0.00033) {
        clear.success++;

        stats("shieldClearStats", clear, "累計腐朽");
        break;
      }
    }
  };

  window.shieldClearReset = function() {
    Object.assign(clear, {attempts:0, success:0, cost:0, bad:0});
    el("shieldClearNow").innerHTML = "";
    stats("shieldClearStats", clear, "累計腐朽");

} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDSHPDv4u7-mMhbuUzzMSDGxljAWTNLJys",
  authDomain: "starro-16e01.firebaseapp.com",
  projectId: "starro-16e01",
  storageBucket: "starro-16e01.firebasestorage.app",
  messagingSenderId: "900308579725",
  appId: "1:900308579725:web:0df09367c95ac826b779c4",
  measurementId: "G-ZTM1PL8L8B"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let displayName = localStorage.getItem("starro_display_name") || "";

function esc(s){
  return String(s ?? "").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function askName(force=false){
  if(!force && displayName) return displayName;
  let n = prompt("請輸入你在全服戰報顯示的暱稱：", displayName || "");
  if(n !== null){
    n = n.trim().slice(0,20);
    if(n){
      displayName = n;
      localStorage.setItem("starro_display_name", n);
    }
  }
  updateNameUI();
  return displayName;
}

function updateNameUI(){
  const e=document.getElementById("fbNameLabel");
  if(e)e.textContent=displayName || "設定暱稱";
}

window.changeStarroName = ()=>askName(true);

window.starroBroadcast = async (type,result,detail="")=>{
  try{
    if(!currentUser) return;
    if(!displayName && !askName()) return;
    await addDoc(collection(db,"jackpots"),{
      uid: currentUser.uid,
      name: displayName,
      type: String(type).slice(0,40),
      result: String(result).slice(0,80),
      detail: String(detail).slice(0,160),
      createdAt: serverTimestamp()
    });
  }catch(err){
    console.error("戰報送出失敗",err);
  }
};

function starroFeedText(v){
  return String(v ?? "").replaceAll("賽高🎉","最頂").replaceAll("賽高","最頂");
}
function starroFeedHtml(v){
  const safe=esc(starroFeedText(v));
  return safe
    .replaceAll("頂級（0.36%）",'<span class="tier-top-red">頂級（0.36%）</span>')
    .replaceAll("頂級 0.36%",'<span class="tier-top-red">頂級 0.36%</span>')
    .replaceAll("頂級（0.36％）",'<span class="tier-top-red">頂級（0.36％）</span>');
}

function renderFeed(rows){
  const ticker=document.getElementById("jackpotTicker");
  const feed=document.getElementById("jackpotFeed");
  if(!ticker||!feed)return;
  if(!rows.length){
    ticker.textContent="尚無大獎紀錄";
    feed.innerHTML="";
    return;
  }
  const top=rows[0];
  ticker.innerHTML=`🔥 ${esc(top.name)}｜${starroFeedHtml(top.type)}｜${starroFeedHtml(top.result)}`;
  feed.innerHTML=rows.map(x=>{
    let time="";
    if(x.createdAt?.toDate){
      time=x.createdAt.toDate().toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"});
    }
    return `<div class="stat" style="margin-top:6px;padding:8px 10px">
      <div><b>${esc(x.name)}</b>｜${starroFeedHtml(x.type)}｜<b>${starroFeedHtml(x.result)}</b></div>
      <div class="tiny">${time}${x.detail?`｜${starroFeedHtml(x.detail)}`:""}</div>
    </div>`;
  }).join("");
}

signInAnonymously(auth).catch(err=>{
  console.error(err);
  const e=document.getElementById("fbStatus");
  if(e)e.textContent="❌ 登入失敗";
});

onAuthStateChanged(auth,user=>{
  currentUser=user;
  const e=document.getElementById("fbStatus");
  if(e)e.textContent=user?"🟢 已連線":"🔴 未連線";
  updateNameUI();
  if(user){
    if(!displayName) setTimeout(()=>askName(),250);
  }
});

const q=query(collection(db,"jackpots"),orderBy("createdAt","desc"),limit(200));
onSnapshot(q,snap=>{
  const sevenDaysAgo = Date.now() - 7*24*60*60*1000;
  const rows=snap.docs
    .map(d=>({id:d.id,...d.data()}))
    .filter(x=>{
      if(!x.createdAt?.toDate) return true;
      return x.createdAt.toDate().getTime() >= sevenDaysAgo;
    });
  renderFeed(rows);
},err=>{
  console.error("戰報讀取失敗",err);
  const e=document.getElementById("fbStatus");
  if(e)e.textContent="⚠️ 戰報讀取失敗";
});
</script>

<script>
function jumpWash(keyword){
  const t=[...document.querySelectorAll("section.card")].find(x=>x.innerText.includes(keyword));
  if(t)t.scrollIntoView({behavior:"smooth",block:"start"});
}
</script>
