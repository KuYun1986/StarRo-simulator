<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1020"><title>繁星仙境模擬器｜管理後台</title>
<style>
:root{--bg:#080c12;--card:#10161e;--card2:#151c26;--line:#27313d;--text:#f4f7fb;--muted:#8f9bad;--green:#55d35a;--blue:#67a0ff;--gold:#ffc42d;--danger:#ff5c42}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% -5%,rgba(48,90,130,.22),transparent 30%),#080c12;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.muted{color:var(--muted)}.tiny{font-size:12px;color:var(--muted)}
.login-screen{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(460px,100%);padding:28px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#141b24,#0c1118);box-shadow:0 30px 80px rgba(0,0,0,.35)}
.logo{display:flex;gap:12px;align-items:center}.logo-mark{width:44px;height:44px;border:1px solid #d83b32;border-radius:10px;display:grid;place-items:center;font-size:22px}.login-card h1{font-size:24px;margin:0}.field{display:grid;gap:6px;margin:14px 0}.field label{font-size:13px;color:#aab5c4;font-weight:800}.field input,.field textarea,.field select{width:100%;background:#0b1119;color:#fff;border:1px solid #34404e;border-radius:9px;padding:10px 12px;min-height:42px}.field textarea{min-height:100px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:9px 14px;border-radius:9px;border:1px solid #3a4654;background:#141b25;color:#fff;font-weight:800}.btn.primary{background:linear-gradient(180deg,#268d34,#176c26);border-color:#319842}.btn.blue{background:#18335d;border-color:#315c94}.btn.danger{background:#3b1715;border-color:#7a332e}.btn.ghost{background:transparent}.btn:disabled{opacity:.5;cursor:not-allowed}.actions{display:flex;gap:8px;flex-wrap:wrap}
.app{min-height:100vh;display:grid;grid-template-columns:270px minmax(0,1fr)}.sidebar{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:#0b1017;padding:18px;overflow:auto}.sidebar .brand{margin-bottom:18px}.brand h2{font-size:18px;margin:8px 0 2px}.status{display:flex;gap:7px;align-items:center;font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:#888}.dot.ok{background:var(--green)}.dot.warn{background:var(--gold)}
.nav{display:grid;gap:6px}.nav button{width:100%;text-align:left;border:1px solid transparent;border-radius:9px;background:transparent;color:#c8d0dc;padding:10px 11px;font-weight:700}.nav button:hover,.nav button.active{background:#141d28;border-color:#2c3a49;color:#fff}.side-footer{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);display:grid;gap:8px}
.main{min-width:0}.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:14px 22px;border-bottom:1px solid var(--line);background:rgba(8,12,18,.92);backdrop-filter:blur(10px)}.topbar h1{font-size:20px;margin:0}.topbar .spacer{flex:1}.content{max-width:1280px;margin:auto;padding:22px}.overview{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}.metric{border:1px solid var(--line);border-radius:12px;background:#10161e;padding:13px}.metric span{font-size:12px;color:var(--muted)}.metric b{display:block;font-size:19px;margin-top:4px}
.feature-table{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#10161e}.feature-row{display:grid;grid-template-columns:minmax(0,1fr) 130px 90px;gap:10px;align-items:center;padding:13px 15px;border-bottom:1px solid var(--line)}.feature-row:last-child{border-bottom:0}.feature-title{font-weight:900}.feature-summary{font-size:12px;color:var(--muted);margin-top:3px}.pill{justify-self:start;padding:4px 8px;border-radius:999px;background:#173923;color:#8df29a;font-size:12px;font-weight:800}.pill.off{background:#321819;color:#ff9e96}
.panel{display:none;margin-top:16px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,#111820,#0c1118);padding:18px}.panel.active{display:block}.panel-head{display:flex;gap:10px;align-items:start;margin-bottom:12px}.panel-head h2{margin:0;font-size:21px}.panel-head .spacer{flex:1}.section{margin-top:14px;padding:14px;border:1px solid #28323e;border-radius:11px;background:#0b1119}.section h3{font-size:15px;margin:0 0 10px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.switch-row{display:flex;align-items:center;justify-content:space-between;gap:10px}.switch-row input{width:20px;height:20px;accent-color:var(--green)}
.range-row,.material-row{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(3,minmax(85px,.7fr)) auto;gap:8px;align-items:end;margin:7px 0}.material-row{grid-template-columns:minmax(220px,2fr) minmax(100px,.7fr) minmax(100px,.7fr)}.material-name{padding:9px 0;overflow-wrap:anywhere}.searchbar{display:flex;gap:8px;margin-bottom:10px}.searchbar input{flex:1;background:#0b1119;color:#fff;border:1px solid #34404e;border-radius:9px;padding:10px 12px}.scrollbox{max-height:480px;overflow:auto;border:1px solid #27313d;border-radius:10px}.collection-item{padding:11px 12px;border-bottom:1px solid #27313d;cursor:pointer}.collection-item:hover{background:#121d29}.collection-item:last-child{border-bottom:0}.collection-item b{display:block}.collection-item span{font-size:12px;color:var(--muted)}
.toast{position:fixed;right:18px;bottom:18px;z-index:20;min-width:260px;max-width:420px;padding:12px 14px;border:1px solid #356343;border-radius:10px;background:#102117;color:#c8ffd1;box-shadow:0 16px 40px rgba(0,0,0,.35)}
pre.code{white-space:pre-wrap;word-break:break-word;background:#071018;border:1px solid #253446;border-radius:9px;padding:12px;font-size:12px;color:#b7c9de;max-height:250px;overflow:auto}
details.admin-details{margin-top:12px;border:1px solid #28323e;border-radius:11px;background:#0b1119;overflow:hidden}details.admin-details>summary{cursor:pointer;padding:13px 14px;font-weight:900;background:#101821;display:flex;align-items:center;gap:8px}details.admin-details[open]>summary{border-bottom:1px solid #28323e}.details-body{padding:14px}.subswitch{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 11px;border:1px solid #2c3948;border-radius:9px;background:#101721;margin-bottom:10px}.subswitch input{width:20px;height:20px;accent-color:var(--green)}
@media(max-width:1000px){.app{grid-template-columns:1fr}.sidebar{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.nav{grid-template-columns:repeat(4,1fr)}.overview{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.content{padding:12px}.topbar{padding:12px}.nav{grid-template-columns:repeat(2,1fr)}.feature-row{grid-template-columns:1fr auto}.feature-row .pill{display:none}.grid2,.grid3,.grid4{grid-template-columns:1fr}.range-row{grid-template-columns:1fr 1fr}.range-row .field:first-child{grid-column:1/-1}.material-row{grid-template-columns:1fr 100px 100px}.overview{grid-template-columns:1fr 1fr}}
</style>
<script src="supabase-config.js"></script><script src="starro-config.js"></script>
</head>
<body>
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="logo"><div class="logo-mark">✦</div><div><h1>繁星仙境模擬器</h1><div class="muted">管理後台</div></div></div>
    <div id="cloudSetupWarn" class="section" style="margin-top:18px"><b>尚未設定雲端登入</b><div class="tiny" style="margin-top:5px">先填寫 supabase-config.js 並執行附帶的 supabase_setup.sql。也可以先用「本機預覽」查看完整後台。</div></div>
    <div class="field"><label>管理員 Email</label><input id="loginEmail" type="email" autocomplete="username" placeholder="admin@example.com"></div>
    <div class="field"><label>密碼</label><input id="loginPassword" type="password" autocomplete="current-password" placeholder="••••••••"></div>
    <div class="actions"><button class="btn primary" id="loginBtn">登入管理後台</button><button class="btn ghost" id="previewBtn">本機預覽</button><a class="btn ghost" href="index.html">返回網站</a></div>
    <div id="loginMsg" class="tiny" style="margin-top:10px"></div>
  </div>
</div>

<div id="adminApp" class="app hidden">
<aside class="sidebar">
  <div class="brand"><div class="logo"><div class="logo-mark">✦</div><div><h2>繁星管理後台</h2><div class="status"><span id="cloudDot" class="dot warn"></span><span id="cloudStatus">本機模式</span></div></div></div></div>
  <div class="nav" id="sideNav"></div>
  <div class="side-footer"><a class="btn ghost" href="index.html">🌟 回到網站</a><button class="btn ghost" id="exportBtn">⬇️ 匯出設定 JSON</button><label class="btn ghost" style="cursor:pointer">⬆️ 匯入設定 JSON<input id="importFile" type="file" accept="application/json" hidden></label><button class="btn danger" id="logoutBtn">登出</button></div>
</aside>
<main class="main">
  <header class="topbar"><h1>繁星仙境模擬器｜管理後台</h1><div class="spacer"></div><span id="saveState" class="tiny">尚未修改</span><button class="btn primary" id="saveAllBtn">💾 儲存全部</button></header>
  <div class="content">
    <div class="overview"><div class="metric"><span>管理項目</span><b id="managedCount">10</b></div><div class="metric"><span>啟用功能</span><b id="enabledCount">0</b></div><div class="metric"><span>設定來源</span><b id="sourceMode">本機</b></div><div class="metric"><span>最後更新</span><b id="updatedAt">—</b></div></div>
    <div class="feature-table" id="featureTable"></div>
    <div id="panels"></div>
  </div>
</main>
</div>
<div id="toast" class="toast hidden"></div>

<script>
const FEATURES=[
 {key:'huajinArmor',icon:'🔥',name:'華金鎧甲/鞋',summary:c=>`每次 ${c.cost} 紅｜${c.stage1Rate}% → ${c.stage2Rate}%`},
 {key:'huajinAccessory',icon:'💎',name:'華金耳環/飾品',summary:c=>`每次 ${c.cost} 紅｜${c.stage1Rate}% → ${c.stage2Rate}%`},
 {key:'auctionNeedle',icon:'🪡',name:'競標針',summary:c=>`每次 ${c.cost} 紅｜第2詞 ${c.secondRate}%｜第3詞 ${c.thirdRate}%`},
 {key:'dragon',icon:'🐉',name:'龍甲',summary:c=>`第四洞 ${c.fourth.lv2to3}%/${c.fourth.lv3toSpecial}%｜第三洞 ${c.third.lv3to4}%/${c.third.lv4to5}%/${c.third.lv5toSpecial}%`},
 {key:'evilWeapon',icon:'⚔️',name:'善惡武器',summary:c=>`${c.rates.lv1to2}% → ${c.rates.lv2to3}% → ${c.rates.lv3to4}% → ${c.rates.lv4to5}%`},
 {key:'timeBoot',icon:'💎',name:'時光靴',summary:c=>c.series.map(x=>`${x.name} ${x.weight}%`).join('｜')},
 {key:'collection',icon:'📚',name:'收藏',summary:c=>Array.isArray(c.items)?`${c.items.length.toLocaleString()} 筆雲端收藏資料`:'使用網站內建收藏資料'},
 {key:'equipment',icon:'💰',name:'裝備價格',summary:c=>`${Object.keys(c.priceOverrides||{}).length} 筆雲端價格覆寫`},
 {key:'game',icon:'🎮',name:'遊戲區',summary:c=>`輪盤 ${c.wheel?.maxBet??5000}紅｜百家樂 ${c.baccarat?.maxBet??30000}紅｜21點 ${c.blackjack?.bet??10000}P｜推筒子 ${c.tongzi?.bet??100000}P`},
 {key:'cash',icon:'💳',name:'現金區',summary:c=>`${(c.tiers||[]).length} 個儲值級距｜商城比值 ${c.shopRatio??280}｜紅利比值 ${c.bonusRatio??1.6}`}
];
let cfg=JSON.parse(JSON.stringify(StarroConfig.all()));
let cloudSession=null,previewMode=false,dirty=false;
let collectionItems=null,equipmentData=null,selectedCollectionIndex=-1;
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function getFeature(k){return cfg.features[k];}
function setDirty(v=true){dirty=v;$('#saveState').textContent=v?'有未儲存變更':'已同步';}
function toast(msg,bad=false){const el=$('#toast');el.textContent=msg;el.style.borderColor=bad?'#7a332e':'#356343';el.style.background=bad?'#2a1110':'#102117';el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),2600)}
function field(label,id,value,type='number',extra=''){return `<div class="field"><label>${label}</label><input id="${id}" type="${type}" value="${esc(value)}" ${extra}></div>`}
function toggleField(key,label='顯示此功能'){return `<div class="section switch-row"><div><b>${label}</b><div class="tiny">關閉後前台會隱藏這個功能。</div></div><input type="checkbox" data-enable="${key}" ${getFeature(key).enabled!==false?'checked':''}></div>`}
function readNum(id,fallback=0){const v=Number($('#'+id)?.value);return Number.isFinite(v)?v:fallback}
function renderShell(){
 $('#sideNav').innerHTML=FEATURES.map((f,i)=>`<button data-open="${f.key}" class="${i===0?'active':''}">${f.icon} ${f.name}</button>`).join('');
 $('#featureTable').innerHTML=FEATURES.map(f=>{const c=getFeature(f.key),on=c.enabled!==false;return `<div class="feature-row"><div><div class="feature-title">${f.icon} ${f.name}</div><div class="feature-summary">${esc(f.summary(c))}</div></div><span class="pill ${on?'':'off'}">${on?'啟用中':'已停用'}</span><button class="btn" data-open="${f.key}">編輯</button></div>`}).join('');
 $('#panels').innerHTML=FEATURES.map((f,i)=>`<section class="panel ${i===0?'active':''}" data-panel="${f.key}"></section>`).join('');
 renderAllPanels(); bindOpen(); updateMetrics();
}
function bindOpen(){document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openPanel(b.dataset.open));}
function openPanel(key){document.querySelectorAll('[data-panel]').forEach(p=>p.classList.toggle('active',p.dataset.panel===key));document.querySelectorAll('#sideNav [data-open]').forEach(b=>b.classList.toggle('active',b.dataset.open===key));document.querySelector(`[data-panel="${key}"]`)?.scrollIntoView({behavior:'smooth',block:'start'});}
function panelHead(key,icon,name,desc){return `<div class="panel-head"><div><h2>${icon} ${name}</h2><div class="muted">${desc}</div></div><div class="spacer"></div><button class="btn primary" data-save-panel="${key}">儲存此區</button></div>${toggleField(key)}`}
function renderRanges(key,idPrefix){const c=getFeature(key);return `<div class="section"><h3>成功後數值區間 / 權重</h3><div id="${idPrefix}Ranges">${(c.ranges||[]).map((r,i)=>`<div class="range-row"><div class="field"><label>區間 ${i+1}</label><input value="${i+1}" disabled></div>${field('最小值',`${idPrefix}Min${i}`,r.min)}${field('最大值',`${idPrefix}Max${i}`,r.max)}${field('權重 %',`${idPrefix}Weight${i}`,r.weight,'number','step="0.01"')}<button class="btn danger" data-remove-range="${key}:${i}">刪除</button></div>`).join('')}</div><button class="btn" data-add-range="${key}">＋ 新增區間</button></div>`}
function renderHuajin(key,icon,name,prefix){const c=getFeature(key);const panel=document.querySelector(`[data-panel="${key}"]`);panel.innerHTML=panelHead(key,icon,name,'展開後可直接修改洗詞花費、兩階段成功率與最終數值權重。')+`<div class="grid3">${field('每次花費（紅利）',prefix+'Cost',c.cost)}${field('第一階段成功率 %',prefix+'Stage1',c.stage1Rate,'number','min="0" max="100" step="0.01"')}${field('第二階段成功率 %',prefix+'Stage2',c.stage2Rate,'number','min="0" max="100" step="0.01"')}</div>`+renderRanges(key,prefix)+`<div class="section"><h3>目前規則摘要</h3><div class="tiny">總進入最終詞機率：約 ${(c.stage1Rate*c.stage2Rate/100).toFixed(4)}%。權重總和 ${(c.ranges||[]).reduce((s,x)=>s+Number(x.weight||0),0).toFixed(2)}%。</div></div>`;}
function renderAuction(){const k='auctionNeedle',c=getFeature(k),p=document.querySelector(`[data-panel="${k}"]`);p.innerHTML=panelHead(k,'🪡','競標針','完整設定每次成本、第2/第3詞機率、特殊詞機率，以及三個詞池。')+`<div class="grid3">${field('每次花費（紅利）','auctionCost',c.cost)}${field('第2詞出現率 %','auctionSecond',c.secondRate,'number','min="0" max="100" step="0.01"')}${field('第3詞出現率 %','auctionThird',c.thirdRate,'number','min="0" max="100" step="0.01"')}${field('無視魔法效果解除 %','auctionMagic',c.specialMagicRate,'number','min="0" max="100" step="0.001"')}${field('死亡 BUFF 不清除 %','auctionBuff',c.specialBuffRate,'number','min="0" max="100" step="0.001"')}</div><div class="section"><h3>詳細詞池</h3><div class="actions"><button class="btn" id="loadAuctionDefaults">載入目前網站詞池</button><button class="btn" id="clearAuctionPools">恢復使用網站內建詞池</button></div><div class="grid3"><div class="field"><label>第1詞池（JSON 陣列）</label><textarea id="auctionPool1">${esc(c.pool1?JSON.stringify(c.pool1,null,2):'')}</textarea></div><div class="field"><label>第2詞池（JSON 陣列）</label><textarea id="auctionPool2">${esc(c.pool2?JSON.stringify(c.pool2,null,2):'')}</textarea></div><div class="field"><label>第3詞池（JSON 陣列）</label><textarea id="auctionPool3">${esc(c.pool3?JSON.stringify(c.pool3,null,2):'')}</textarea></div></div><div class="tiny">留空＝沿用 identify.html 目前內建詞池。格式：每筆 [名稱, 最小值, 最大值, 單位]。</div></div>`;}
function renderDragon(){const k='dragon',c=getFeature(k),p=document.querySelector(`[data-panel="${k}"]`);p.innerHTML=panelHead(k,'🐉','龍甲','可分別修改第四洞與第三洞每一階段成功率。')+`<div class="section"><h3>第四洞</h3><div class="grid2">${field('LV2 → LV3 %','dragon4_23',c.fourth.lv2to3)}${field('LV3 → 特級 %','dragon4_3s',c.fourth.lv3toSpecial)}</div></div><div class="section"><h3>第三洞</h3><div class="grid3">${field('LV3 → LV4 %','dragon3_34',c.third.lv3to4)}${field('LV4 → LV5 %','dragon3_45',c.third.lv4to5)}${field('LV5 → 特級 %','dragon3_5s',c.third.lv5toSpecial)}</div></div>`;}
function renderEvil(){const k='evilWeapon',c=getFeature(k),p=document.querySelector(`[data-panel="${k}"]`);p.innerHTML=panelHead(k,'⚔️','善惡武器','四個升級階段都可獨立修改。')+`<div class="grid4">${field('LV1 → LV2 %','evil12',c.rates.lv1to2)}${field('LV2 → LV3 %','evil23',c.rates.lv2to3)}${field('LV3 → LV4 %','evil34',c.rates.lv3to4)}${field('LV4 → LV5 %','evil45',c.rates.lv4to5)}</div>`;}
function renderTime(){const k='timeBoot',c=getFeature(k),p=document.querySelector(`[data-panel="${k}"]`);p.innerHTML=panelHead(k,'💎','時光超越靴','第四洞系列權重、第三洞變異詞與第四洞類型都能直接查看及修改。')+`<div class="section"><h3>第四洞系列權重</h3>${(c.series||[]).map((x,i)=>`<div class="grid2">${field('系列名稱','timeName'+i,x.name,'text')}${field('權重 %','timeWeight'+i,x.weight,'number','step="0.01"')}</div>`).join('')}</div><div class="grid2"><div class="field"><label>第三洞變異詞（每行一個）</label><textarea id="timeThirdPool">${esc((c.thirdPool||[]).join('\n'))}</textarea></div><div class="field"><label>第四洞類型（每行一個）</label><textarea id="timeTypes">${esc((c.types||[]).join('\n'))}</textarea></div></div>`;}

 if(key==='auctionNeedle'){c.cost=readNum('auctionCost',c.cost);c.secondRate=readNum('auctionSecond',c.secondRate);c.thirdRate=readNum('auctionThird',c.thirdRate);c.specialMagicRate=readNum('auctionMagic',c.specialMagicRate);c.specialBuffRate=readNum('auctionBuff',c.specialBuffRate);for(const [id,prop] of [['auctionPool1','pool1'],['auctionPool2','pool2'],['auctionPool3','pool3']]){const s=$('#'+id)?.value.trim();if(!s)c[prop]=null;else{try{c[prop]=JSON.parse(s)}catch(e){throw new Error(id+' JSON 格式錯誤')}}}}
 if(key==='dragon'){c.fourth.lv2to3=readNum('dragon4_23',c.fourth.lv2to3);c.fourth.lv3toSpecial=readNum('dragon4_3s',c.fourth.lv3toSpecial);c.third.lv3to4=readNum('dragon3_34',c.third.lv3to4);c.third.lv4to5=readNum('dragon3_45',c.third.lv4to5);c.third.lv5toSpecial=readNum('dragon3_5s',c.third.lv5toSpecial)}
 if(key==='evilWeapon'){c.rates.lv1to2=readNum('evil12',c.rates.lv1to2);c.rates.lv2to3=readNum('evil23',c.rates.lv2to3);c.rates.lv3to4=readNum('evil34',c.rates.lv3to4);c.rates.lv4to5=readNum('evil45',c.rates.lv4to5)}
 if(key==='timeBoot'){c.series=(c.series||[]).map((x,i)=>({name:$('#timeName'+i)?.value.trim()||x.name,weight:readNum('timeWeight'+i,x.weight)}));c.thirdPool=$('#timeThirdPool').value.split(/\n+/).map(x=>x.trim()).filter(Boolean);c.types=$('#timeTypes').value.split(/\n+/).map(x=>x.trim()).filter(Boolean)}
 if(key==='collection'){c.notice=$('#collectionNotice')?.value||'';if(collectionItems)c.items=collectionItems}
 if(key==='equipment'){c.servicePrices={bless:readNum('svcBless',6),check:readNum('svcCheck',18),bigGold:readNum('svcBigGold',950),smallGold:readNum('svcSmallGold',120),bigGray:readNum('svcBigGray',148),smallGray:readNum('svcSmallGray',1),taffy:readNum('svcTaffy',40),dust:readNum('svcDust',1),red:readNum('svcRed',220)}}
 if(key==='game'){const w=c.wheel||{},b=c.baccarat||{},bj=c.blackjack||{},tt=c.tongzi||{};w.enabled=$('#gameWheelEnabled')?.checked!==false;w.maxBet=readNum('gameWheelMaxBet',5000);w.maxColors=readNum('gameWheelMaxColors',4);w.betStep=readNum('gameWheelStep',100);w.options=(w.options||[]).map((x,i)=>({...x,name:$('#gameWheelName'+i)?.value.trim()||x.name,p:readNum('gameWheelP'+i,x.p),pay:readNum('gameWheelPay'+i,x.pay)}));b.enabled=$('#gameBaccaratEnabled')?.checked!==false;b.maxBet=readNum('gameBaccaratMaxBet',30000);b.betStep=readNum('gameBaccaratStep',100);b.payouts={player:readNum('bacPayPlayer',1),banker:readNum('bacPayBanker',.95),tie:readNum('bacPayTie',8),playerPair:readNum('bacPayPlayerPair',11),bankerPair:readNum('bacPayBankerPair',11),big:readNum('bacPayBig',.53),small:readNum('bacPaySmall',1.45),playerOdd:readNum('bacPayPlayerOdd',.95),playerEven:readNum('bacPayPlayerEven',.88),bankerOdd:readNum('bacPayBankerOdd',.92),bankerEven:readNum('bacPayBankerEven',.92)};bj.enabled=$('#gameBlackjackEnabled')?.checked!==false;bj.bet=readNum('gameBjBet',10000);bj.startChips=readNum('gameBjChips',500000);bj.dealerStand=readNum('gameBjStand',17);bj.blackjackPayout=readNum('gameBjPayout',2);tt.enabled=$('#gameTongziEnabled')?.checked!==false;tt.bet=readNum('gameTtBet',100000);tt.maxHands=readNum('gameTtHands',10);tt.dealerPairBonus=readNum('gameTtPairBonus',5);c.wheel=w;c.baccarat=b;c.blackjack=bj;c.tongzi=tt}
 if(key==='cash'){c.redPerT=readNum('cashRedPerT',1);c.defaultAmount=readNum('cashDefaultAmount',1000);c.shopRatio=readNum('cashShopRatio',280);c.bonusRatio=readNum('cashBonusRatio',1.6);c.tiers=(c.tiers||[]).map((x,i)=>{const maxRaw=$('#cashTierMax'+i)?.value.trim();return {min:readNum('cashTierMin'+i,x.min||0),max:maxRaw===''?null:Number(maxRaw),rate:readNum('cashTierRate'+i,x.rate||0),label:$('#cashTierLabel'+i)?.value.trim()||x.label||''}});c.urBox2=(c.urBox2||[]).map((x,i)=>({name:$('#cashUrName'+i)?.value.trim()||x.name,price:readNum('cashUrPrice'+i,x.price||0)}));const js=$('#cashCumulativeJson')?.value.trim();if(!js)c.cumulativeRewardTiers=null;else{try{c.cumulativeRewardTiers=JSON.parse(js)}catch(e){throw new Error('累積儲值獎勵 JSON 格式錯誤')}}}

function sb(){return window.STARRO_SUPABASE||{}}
async function login(){const s=sb();if(!s.url||!s.anonKey){$('#loginMsg').textContent='尚未設定 Supabase，請先完成 supabase-config.js。';return}const email=$('#loginEmail').value.trim(),password=$('#loginPassword').value;if(!email||!password){$('#loginMsg').textContent='請輸入 Email 與密碼';return}$('#loginBtn').disabled=true;try{const r=await fetch(s.url.replace(/\/$/,'')+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:s.anonKey,'Content-Type':'application/json'},body:JSON.stringify({email,password})});const d=await r.json();if(!r.ok)throw new Error(d.error_description||d.msg||'登入失敗');cloudSession=d;sessionStorage.setItem('starro_admin_session',JSON.stringify(d));await loadRemoteForAdmin();showApp(true)}catch(e){$('#loginMsg').textContent=e.message}finally{$('#loginBtn').disabled=false}}
async function loadRemoteForAdmin(){const s=sb(),row=encodeURIComponent(s.configRow||'main');const r=await fetch(s.url.replace(/\/$/,'')+`/rest/v1/site_config?id=eq.${row}&select=config,updated_at`,{headers:{apikey:s.anonKey,Authorization:'Bearer '+cloudSession.access_token}});if(!r.ok)throw new Error('讀取雲端設定失敗');const d=await r.json();if(d[0]?.config){cfg=deepMerge(StarroConfig.defaults,d[0].config);StarroConfig.replace(cfg)}}
function deepMerge(a,b){if(Array.isArray(b))return JSON.parse(JSON.stringify(b));if(!b||typeof b!=='object')return b===undefined?JSON.parse(JSON.stringify(a)):b;const o=(a&&typeof a==='object'&&!Array.isArray(a))?JSON.parse(JSON.stringify(a)):{};Object.keys(b).forEach(k=>o[k]=deepMerge(o[k],b[k]));return o}
async function saveRemote(obj){const s=sb(),id=s.configRow||'main';const r=await fetch(s.url.replace(/\/$/,'')+'/rest/v1/site_config?on_conflict=id',{method:'POST',headers:{apikey:s.anonKey,Authorization:'Bearer '+cloudSession.access_token,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({id,config:obj,updated_at:new Date().toISOString()})});if(!r.ok){const txt=await r.text();throw new Error('雲端儲存失敗：'+txt)}}
function showApp(cloud){$('#loginScreen').classList.add('hidden');$('#adminApp').classList.remove('hidden');$('#cloudDot').className='dot '+(cloud?'ok':'warn');$('#cloudStatus').textContent=cloud?'已登入雲端':'本機預覽模式';$('#sourceMode').textContent=cloud?'雲端':'本機';renderShell()}
function extractAssigned(text,marker){const at=text.indexOf(marker);if(at<0)throw new Error('找不到 '+marker);let i=text.indexOf(marker.includes('EQUIPMENT')?'{':'[',at),open=text[i],close=open==='['?']':'}',depth=0,str=false,escp=false;for(let j=i;j<text.length;j++){const ch=text[j];if(str){if(escp)escp=false;else if(ch==='\\')escp=true;else if(ch==='"')str=false;continue}if(ch==='"'){str=true;continue}if(ch===open)depth++;else if(ch===close){depth--;if(depth===0)return JSON.parse(text.slice(i,j+1));}}throw new Error('資料解析失敗')}
async function loadCollectionData(){try{const r=await fetch('collection.html',{cache:'no-store'});const text=await r.text();collectionItems=Array.isArray(cfg.features.collection.items)?JSON.parse(JSON.stringify(cfg.features.collection.items)):extractAssigned(text,'const ITEMS=');$('#collectionCount').textContent=collectionItems.length.toLocaleString()+' 筆';renderCollectionList();setDirty();toast('已載入收藏資料')}catch(e){toast('收藏資料載入失敗：'+e.message,true)}}
function renderCollectionList(){const el=$('#collectionList');if(!collectionItems){el.innerHTML='<div class="collection-item"><span>尚未載入收藏資料</span></div>';return}const q=($('#collectionSearch')?.value||'').trim().toLowerCase();const rows=[];for(let i=0;i<collectionItems.length;i++){const x=collectionItems[i],hay=(x.name+' '+x.effect+' '+x.game+' '+x.group).toLowerCase();if(q&&!hay.includes(q))continue;rows.push({i,x});if(rows.length>=100)break}el.innerHTML=rows.map(({i,x})=>`<div class="collection-item" data-col-index="${i}"><b>${esc(x.name)}</b><span>${esc(x.group)}｜${esc(x.game)}｜佔格 ${esc(x.slot)}</span></div>`).join('')||'<div class="collection-item"><span>沒有符合資料</span></div>';el.querySelectorAll('[data-col-index]').forEach(r=>r.onclick=()=>editCollection(+r.dataset.colIndex))}
function editCollection(i){selectedCollectionIndex=i;const x=collectionItems[i];$('#collectionDetail').classList.remove('hidden');$('#colGroup').value=x.group||'';$('#colRow').value=x.row??'';$('#colDc').value=x.dc??'';$('#colGame').value=x.game||'';$('#colSlot').value=x.slot??0;$('#colName').value=x.name||'';$('#colEffect').value=x.effect||'';$('#colRequired').value=(x.required||[]).join('\n');$('#collectionDetail').scrollIntoView({behavior:'smooth',block:'nearest'})}
function applyCollectionDetail(){if(selectedCollectionIndex<0)return;collectionItems[selectedCollectionIndex]={group:$('#colGroup').value.trim(),row:Number($('#colRow').value)||$('#colRow').value,dc:$('#colDc').value.trim(),game:$('#colGame').value.trim(),name:$('#colName').value.trim(),effect:$('#colEffect').value.trim(),slot:Number($('#colSlot').value)||0,required:$('#colRequired').value.split(/\n+/).map(x=>x.trim()).filter(Boolean)};cfg.features.collection.items=collectionItems;setDirty();renderCollectionList();toast('已套用單筆修改，記得儲存')}
function addCollection(){if(!collectionItems)collectionItems=[];collectionItems.unshift({group:'普通收藏',row:'',dc:'',game:'',name:'新收藏',effect:'',slot:1,required:[]});cfg.features.collection.items=collectionItems;renderCollectionList();editCollection(0);setDirty()}
function deleteCollection(){if(selectedCollectionIndex<0||!collectionItems)return;if(!confirm('確定刪除這筆收藏？'))return;collectionItems.splice(selectedCollectionIndex,1);cfg.features.collection.items=collectionItems;selectedCollectionIndex=-1;$('#collectionDetail').classList.add('hidden');renderCollectionList();$('#collectionCount').textContent=collectionItems.length.toLocaleString()+' 筆';setDirty()}
async function loadEquipment(){try{const r=await fetch('equipment.html',{cache:'no-store'});const text=await r.text();equipmentData=extractAssigned(text,'const EQUIPMENT_DATA=');renderEquipmentList();toast('已載入裝備材料')}catch(e){toast('裝備資料載入失敗：'+e.message,true)}}
function equipmentMaster(){if(!equipmentData)return[];const m=new Map();Object.values(equipmentData).flat().forEach(x=>{if(!m.has(x.name))m.set(x.name,{name:x.name,price:Number(x.price||0),pack:Number(x.pack||1)});else{const a=m.get(x.name);if(!a.price&&x.price)a.price=Number(x.price);if((!a.pack||a.pack===1)&&x.pack&&x.pack!==1)a.pack=Number(x.pack)}});return [...m.values()]}
function renderEquipmentList(){const el=$('#equipmentList');if(!equipmentData){el.innerHTML='<div class="collection-item"><span>尚未載入裝備材料</span></div>';return}const q=($('#equipmentSearch')?.value||'').trim().toLowerCase(),ov=cfg.features.equipment.priceOverrides||{};const rows=equipmentMaster().filter(x=>!q||x.name.toLowerCase().includes(q)).slice(0,150);el.innerHTML=rows.map((x,i)=>{const v=ov[x.name]||{};return `<div class="material-row" style="padding:8px 10px;border-bottom:1px solid var(--line)"><div class="material-name">${esc(x.name)}</div><div class="field" style="margin:0"><label>價格</label><input data-eq-name="${esc(x.name)}" data-eq-kind="price" type="number" value="${esc(v.price??x.price)}"></div><div class="field" style="margin:0"><label>單位</label><input data-eq-name="${esc(x.name)}" data-eq-kind="pack" type="number" value="${esc(v.pack??x.pack)}"></div></div>`}).join('');el.querySelectorAll('[data-eq-name]').forEach(inp=>inp.onchange=()=>{const n=inp.dataset.eqName,kind=inp.dataset.eqKind;cfg.features.equipment.priceOverrides[n]=cfg.features.equipment.priceOverrides[n]||{};cfg.features.equipment.priceOverrides[n][kind]=Number(inp.value)||0;setDirty();updatePriceCount()})}
function updatePriceCount(){const el=$('#priceOverrideCount');if(el)el.textContent=Object.keys(cfg.features.equipment.priceOverrides||{}).length+' 筆已修改'}
async function loadAuctionDefaults(){try{const r=await fetch('identify.html',{cache:'no-store'}),text=await r.text();const grab=(marker)=>{const at=text.indexOf(marker);if(at<0)return null;let i=text.indexOf('[',at),depth=0,str=false,escp=false;for(let j=i;j<text.length;j++){const ch=text[j];if(str){if(escp)escp=false;else if(ch==='\\')escp=true;else if(ch==='"')str=false;continue}if(ch==='"'){str=true;continue}if(ch==='[')depth++;else if(ch===']'){depth--;if(depth===0)return JSON.parse(text.slice(i,j+1))}}return null};const p1=grab('auctionNeedlePool1Default='),p2=grab('auctionNeedlePool2Default='),p3=grab('auctionNeedlePool3NormalDefault=');if(p1)$('#auctionPool1').value=JSON.stringify(p1,null,2);if(p2)$('#auctionPool2').value=JSON.stringify(p2,null,2);if(p3)$('#auctionPool3').value=JSON.stringify(p3,null,2);setDirty();toast('已載入競標針詞池')}catch(e){toast('詞池載入失敗：'+e.message,true)}}
async function loadCashCumulative(){try{const r=await fetch('CASH.html',{cache:'no-store'}),text=await r.text();const data=extractAssigned(text,'CUMULATIVE_REWARD_TIERS=');$('#cashCumulativeJson').value=JSON.stringify(data,null,2);getFeature('cash').cumulativeRewardTiers=data;setDirty();toast('已載入 CASH 累積儲值獎勵')}catch(e){toast('CASH 獎勵資料載入失敗：'+e.message,true)}}
function exportConfig(){captureAll();const blob=new Blob([JSON.stringify(cfg,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='starro-config-backup.json';a.click();URL.revokeObjectURL(a.href)}
$('#loginBtn').onclick=login;$('#previewBtn').onclick=()=>{previewMode=true;showApp(false)};$('#saveAllBtn').onclick=saveAll;$('#exportBtn').onclick=exportConfig;$('#logoutBtn').onclick=()=>{sessionStorage.removeItem('starro_admin_session');location.reload()};$('#importFile').onchange=async e=>{try{const o=JSON.parse(await e.target.files[0].text());cfg=deepMerge(StarroConfig.defaults,o);StarroConfig.replace(cfg);setDirty();renderShell();toast('設定已匯入，請按儲存全部')}catch(err){toast('匯入失敗：'+err.message,true)}};
const s=sb();if(s.url&&s.anonKey)$('#cloudSetupWarn').classList.add('hidden');
try{const saved=JSON.parse(sessionStorage.getItem('starro_admin_session')||'null');if(saved?.access_token&&s.url&&s.anonKey){cloudSession=saved;loadRemoteForAdmin().then(()=>showApp(true)).catch(()=>sessionStorage.removeItem('starro_admin_session'));}}catch(e){}
</script>
