name: StarRo UI Acceptance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collection-cloud-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe live Supabase Google provider and collection progress table
        run: node tests/collection-cloud-readiness.cjs
  contrast-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install contrast audit browser and engine
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 axe-core@4.10.3
          npx playwright install --with-deps chromium
      - name: Audit desktop and mobile color contrast including interactive panels
        run: CONTRAST_ENFORCE=1 node tests/contrast-audit.cjs
      - name: Upload full contrast audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starro-contrast-audit
          path: acceptance-artifacts/contrast-report.json
          retention-days: 14
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runner
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run collection Google sync and navigation unit tests
        run: node --test tests/collection-cloud.test.cjs
      - name: Test strict LT source matching and official effect data
        run: node --test tests/equipment-enrichment.test.cjs tests/collection-simulation-core.test.cjs tests/collection-export.test.cjs
      - name: Run materials regression tests
        run: node --test tests/service-config-regression.test.cjs
      - name: Run Chromium desktop/mobile acceptance tests
        run: node tests/browser-acceptance.cjs
      - name: Check public Pages deployment (informational)
        if: always()
        shell: bash
        run: |
          mkdir -p acceptance-artifacts
          SITE="https://kuyun1986.github.io/StarRo-simulator/"
          CODE=$(curl -L --max-time 20 -sS -o /tmp/starro-live.html -w '%{http_code}' "$SITE" || true)
          CSS=$(curl -L --max-time 20 -sS -o /tmp/starro-live.css -w '%{http_code}' "${SITE}starro-polish.css" || true)
          {
            echo "Checked URL: $SITE"
            echo "Index HTTP: $CODE"
            echo "Shared style HTTP: $CSS"
            if [ "$CODE" = "200" ]; then
              if grep -q 'starro-polish.css' /tmp/starro-live.html; then
                echo "Published index references polish CSS: yes"
              else
                echo "Published index references polish CSS: no"
              fi
            fi
            if [ "$CSS" = "200" ]; then
              if grep -q 'ux-section-index' /tmp/starro-live.css; then
                echo "Published polish CSS includes quick navigation: yes"
              else
                echo "Published polish CSS includes quick navigation: no"
              fi
            fi
          } | tee acceptance-artifacts/live-deployment.txt
      - name: Bundle tested source for reproduction
        if: always()
        run: |
          mkdir -p acceptance-artifacts
          tar -czf acceptance-artifacts/checkout-source.tgz --exclude=.git --exclude=acceptance-artifacts --exclude=node_modules .
      - name: Store screenshot and test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: starro-ui-acceptance
          path: acceptance-artifacts/
          retention-days: 14
