name: Inspect catalog reference
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/inspect-catalog-reference.yml
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect external public reference safely
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,html,re
          from html.parser import HTMLParser
          url='https://ro-collectitem-yuno.netlify.app/'
          try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=20) as res:
                  body=res.read(500000).decode('utf-8','replace')
                  print('STATUS',res.status,'URL',res.url,'LENGTH',len(body))
              with open('reference-site.html','w',encoding='utf-8') as fp:fp.write(body)
              class Parser(HTMLParser):
                  def __init__(self):super().__init__();self.tags=[];self.active=False
                  def handle_starttag(self,t,a):
                      if t in ('title','h1','h2','h3','button','a','label','option'):self.active=t;self.buf=''
                  def handle_data(self,d):
                      if self.active:self.buf+=d
                  def handle_endtag(self,t):
                      if self.active==t:
                          text=' '.join(self.buf.split())
                          if text:self.tags.append((t,text[:160]))
                          self.active=False
              p=Parser();p.feed(body)
              print('DISPLAY_LABELS:',p.tags[:120])
              print('SCRIPTS:',re.findall(r'<script[^>]+src=["\']([^"\']+)',body,re.I)[:30])
              print('IMAGES:',re.findall(r'<img[^>]+src=["\']([^"\']+)',body,re.I)[:15])
              print('SNIPPET:',body[:500])
              names = re.findall(r'(?:const|let)\s+([A-Za-z_$][\w$]*)\s*=',body)
              print('VARIABLES:',[n for n in names if any(w in n.lower() for w in ['item','gacha','image','source','db','map'])][:65])
              for token in ['道具百科','取得來源','來源','itemDatabase','itemData','ITEM_DB','itemDb','gachaData','itemImage']:
                  i=body.find(token)
                  print('MARKER', token, i, body[max(0,i-120):i+260].replace('\\n',' ') if i>=0 else '')
              print('RAW_DATA_OBJECTS:',[(m.group(1),m.start()) for m in list(re.finditer(r'(?:const|let)\\s+(\\w+)\\s*=\\s*[\\[{]',body))[:65]])
          except Exception as e:print('FETCH ERROR',type(e).__name__,str(e))
          PY

      - name: Save public HTML for structured factual matching
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-site-snapshot
          path: reference-site.html
          retention-days: 1
